name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v7
      - name: Install GStreamer
        run: |
          sudo apt-get update -q
          sudo -E apt-get install -y -q --no-install-recommends \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-bad
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - name: No NDI runtime in the repository or the binary
        run: |
          if git ls-files | grep -Ei 'libndi|Processing\.NDI'; then
            echo "NDI runtime files must never be committed"; exit 1
          fi
          if ldd target/release/showmesh-ndi | grep -i ndi; then
            echo "The binary must load the NDI runtime at run time, not link it"; exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: showmesh-ndi-${{ runner.arch }}
          path: target/release/showmesh-ndi
